version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: mycargonaut_db
    environment:
      POSTGRES_DB: mycargonaut
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:

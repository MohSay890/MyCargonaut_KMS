<div class="forgot-password-page">
  <div class="forgot-password-card">
    <h1>Passwort zurücksetzen</h1>
    <p class="subtitle">Geben Sie Ihre E-Mail Adresse ein, um Ihr Passwort zurückzusetzen</p>

    <!-- Success Message -->
    <div class="success-message" *ngIf="message">
      <div class="success-icon">✓</div>
      {{ message }}
      <div class="demo-token" *ngIf="resetToken">
        <strong>Demo Token:</strong> {{ resetToken }}
        <br>
        <small>Sie werden automatisch weitergeleitet...</small>
      </div>
    </div>

    <!-- Error Message -->
    <div class="error-message" *ngIf="error">
      {{ error }}
    </div>

    <!-- Form (hide after success) -->
    <form class="forgot-password-form" (ngSubmit)="onRequestReset()" *ngIf="!message">
      <div class="form-group">
        <label for="email">E-Mail Adresse</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="deine@email.de"
          required
          [disabled]="isLoading">
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Reset-Link senden</span>
        <span *ngIf="isLoading">Wird gesendet...</span>
      </button>
    </form>

    <div class="back-to-login">
      <a routerLink="/login">← Zurück zum Login</a>
    </div>
  </div>
</div>

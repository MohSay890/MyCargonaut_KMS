<div class="reset-password-page">
  <div class="reset-password-card">
    <!-- Verifying Token -->
    <div *ngIf="isVerifying" class="verifying">
      <div class="spinner"></div>
      <p>Token wird überprüft...</p>
    </div>

    <!-- Invalid Token -->
    <div *ngIf="!isVerifying && !tokenValid" class="invalid-token">
      <div class="error-icon">✕</div>
      <h1>Ungültiger Link</h1>
      <p class="error-message">{{ error }}</p>
      <div class="back-to-login">
        <a routerLink="/forgot-password">Neuen Reset-Link anfordern</a>
      </div>
    </div>

    <!-- Valid Token - Reset Form -->
    <div *ngIf="!isVerifying && tokenValid">
      <h1>Neues Passwort setzen</h1>
      <p class="subtitle">Bitte geben Sie Ihr neues Passwort ein</p>

      <!-- Success Message -->
      <div class="success-message" *ngIf="message">
        <div class="success-icon">✓</div>
        {{ message }}
        <br>
        <small>Sie werden zum Login weitergeleitet...</small>
      </div>

      <!-- Error Message -->
      <div class="error-message" *ngIf="error">
        {{ error }}
      </div>

      <!-- Form (hide after success) -->
      <form class="reset-password-form" (ngSubmit)="onResetPassword()" *ngIf="!message">
        <div class="form-group">
          <label for="newPassword">Neues Passwort</label>
          <div class="password-input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="newPassword"
              [(ngModel)]="newPassword"
              name="newPassword"
              placeholder="Mindestens 6 Zeichen"
              required
              [disabled]="isLoading">
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility('password')"
              [disabled]="isLoading">
              {{ showPassword ? '👁️' : '👁️‍🗨️' }}
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Passwort bestätigen</label>
          <div class="password-input-wrapper">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              placeholder="Passwort wiederholen"
              required
              [disabled]="isLoading">
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility('confirm')"
              [disabled]="isLoading">
              {{ showConfirmPassword ? '👁️' : '👁️‍🗨️' }}
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Passwort zurücksetzen</span>
          <span *ngIf="isLoading">Wird gespeichert...</span>
        </button>
      </form>

      <div class="back-to-login" *ngIf="!message">
        <a routerLink="/login">← Zurück zum Login</a>
      </div>
    </div>
  </div>
</div>

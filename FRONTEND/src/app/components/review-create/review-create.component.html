<div class="review-create-page">
  <div class="main-content">
    <h1>Bewertung abgeben</h1>
    <p class="subtitle">{{ driverName }} • {{ tripRoute }}</p>

    <div class="review-form">
      <div class="form-section">
        <h2>Gesamtbewertung *</h2>
        <div class="star-rating">
          <button *ngFor="let star of getStars(overallRating); let i = index"
                  (click)="setRating('overall', i + 1)"
                  [class.filled]="i < overallRating">{{ star }}</button>
        </div>
      </div>

      <div class="form-section">
        <h2>Deine Erfahrung</h2>
        <textarea [(ngModel)]="reviewComment" placeholder="Beschreibe deine Erfahrung..."></textarea>
      </div>

      <div class="form-section">
        <h2>Eigenschaften (optional)</h2>
        <div class="tags-selection">
          <button *ngFor="let tag of availableTags"
                  class="tag-btn"
                  [class.selected]="isTagSelected(tag)"
                  (click)="toggleTag(tag)">{{ tag }}</button>
        </div>
      </div>

      <div class="form-actions">
        <button (click)="onCancel()">Abbrechen</button>
        <button [disabled]="!isFormValid()" (click)="onSubmitReview()">Abschicken</button>
      </div>
    </div>
  </div>
</div>
